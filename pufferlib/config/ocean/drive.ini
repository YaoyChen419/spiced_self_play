[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
; Set to None to disable recurrence. In case this the policy will only see
; the current observation (o_t). Set to "Recurrent" to provide the policy with
; memory through an LSTM.
rnn_name = None

[vec]
num_workers = 8
num_envs = 8
batch_size = 4
;backend = Serial

[policy]
[rnn]


[env]
num_agents = 1024
; Options: discrete, continuous
action_type = continuous
; Options: classic, jerk, delta_local
dynamics_model = delta_local
; Reward conditioning
; If True, set the rewards to the values below, if False, we sample U[0, value]
fix_rewards = True
fix_lambdas = True
lambda_value = 0.0
reward_vehicle_collision = -1.0
reward_offroad_collision = -1.0
reward_goal = 1.0
; Sensor noise
obs_partner_noise_speed = 0.0
obs_partner_noise_pos = 0.0
; Discretization
dt = 0.1
; Reset vecenvs asynchronously (leave True for training; False is useful for eval)
async_resets = True
; Meters around goal to be considered "reached"
goal_radius = 2.5
; Max target speed in m/s for the agent to maintain towards the goal
goal_speed = 100.0
; What to do when the goal is reached. Options: 0:"remove", 1:"generate_new_goals", 2:"stop"
goal_behavior = 0
; Determines the target distance to the new goal ind the case of goal_behavior = generate_new_goals.
; Large numbers will select a goal point further away from the agent's current position.
goal_target_distance = 30.0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
collision_behavior = 0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
offroad_behavior = 0
; Number of steps before termination
episode_length = 110
resample_frequency = 910
termination_mode = 1 # 0 - terminate at episode_length, 1 - terminate after all agents are done
map_dir = "resources/drive/binaries/training"
num_maps = 50000
; Determines which step of the trajectory to initialize the agents at upon reset
init_steps = 0
; Options: "control_vehicles", "control_agents", "control_wosac", "control_sdc_only", "control_mixed_play"
control_mode = "control_agents"
; Options: "static", "policy", "replay", "idm", "corridor_idm"
sdc_controller = "policy"
non_sdc_controller = "policy"
; Options: "auto", "static", "policy", "replay", "idm", "corridor_idm"
; auto preserves legacy behavior unless non_sdc_controller is IDM, in which case non-vehicles replay logs.
non_vehicle_controller = "auto"
; Options: "created_all_valid", "create_only_controlled"
init_mode = "create_all_valid"
; Sets the maximum number of controllable agents per scene, ONLY used if control_mode is "control_mixed_play"
max_controlled_agents = 32
; Render mode options:
; 0:"window" = pop-up raylib window (original)
; 1:"headless" = off-screen; frames piped to ffmpeg (recommended for training)
render_mode = 1
; Options for regularization. Options: "kl_anchor", "log_likelihood", None
reg_mode = "kl_anchor"
anchor_cpt_path = "models/anchors/bc_delta_local_200maps_o0rwn1i5.pt"

[train]
seed = 42
torch_deterministic = True
cpu_offload = False
device = cuda
data_dir = experiments
total_timesteps = 20_000_000_000
checkpoint_interval = 500

agent = fasttd3

critic_learning_rate = 3e-4
actor_learning_rate = 3e-4
critic_learning_rate_end = 3e-4
actor_learning_rate_end = 3e-4

buffer_size = 51200
num_steps = 1
gamma = 0.99
tau = 0.1
batch_size = 32768

policy_noise = 0.001
std_min = 0.001
std_max = 0.4
learning_starts = 10
policy_frequency = 2
noise_clip = 0.5
num_updates = 2

init_scale = 0.01

num_atoms = 101
v_min = -250.0
v_max = 250.0

critic_hidden_dim = 1024
actor_hidden_dim = 512

use_cdq = True

compile = True
compile_mode = reduce-overhead

obs_normalization = True
reward_normalization = False

use_grad_norm_clipping = False
max_grad_norm = 0.0

amp = True
amp_dtype = bf16

disable_bootstrap = False
weight_decay = 0.1

sim_type = ""
sim_dimension = 64
critic_seq_len = 8
actor_seq_len = 8

[sweep]
method = Protein
metric = eval/hr_mean_did_collide
goal = minimize
downsample = 10

[eval]
eval_interval = 500
; Path to dataset used for evaluation
map_dir = "resources/drive/binaries/training"
; Number of agents to evaluate
num_eval_agents = 512
; If True, enable self-play evaluation (pair policy-controlled agent with a copy of itself)
self_play_eval = True
; If True, enable human replay evaluation (pair policy-controlled agent with human replays)
human_replay_eval = True
; Which env to render during eval. Options: "first" (by index), "worst_collision", "random"
render_select_mode = "random"
; If True, render random scenarios. Note: Doing this frequency will slow down the training.
render_human_replay_eval = True
render_self_play_eval = True
; Number of scenarios to process per batch
wosac_batch_size = 64
; Target number of unique scenarios perform evaluation in
wosac_target_scenarios = 64
; Total pool of scenarios to sample from
wosac_scenario_pool_size = 10000
; Max batches, used as a timeout to prevent an infinite loop
wosac_max_batches = 100
backend = PufferEnv
; WOSAC (Waymo Open Sim Agents Challenge) evaluation settings
; If True, enables evaluation on realism metrics each time we save a checkpoint
wosac_realism_eval = False
; Number of policy rollouts per scene
wosac_num_rollouts = 32
; When to start the simulation
wosac_init_steps = 10
; Control everything valid at init in the scene
wosac_control_mode = "control_wosac"
; Create everything in valid at init the scene
wosac_init_mode = "create_all_valid"
; Stop and terminate when reaching the goal
wosac_goal_behavior = 2
; Whether to include post-done transitions in the metric calculations
wosac_filter_out_post_done = False
; Can shrink goal radius for WOSAC evaluation
wosac_goal_radius = 2.5
wosac_sanity_check = False
; Only return aggregate results across all scenes
wosac_aggregate_results = True
; Evaluation mode: "policy", "ground_truth"
wosac_eval_mode = "policy"



[sweep.env.lambda_value]
distribution = log_normal
min = 0.0001
mean = 0.015
max = 0.15
scale = auto

[sweep.env.obs_partner_noise_pos]
distribution = log_normal
min = 0.000001
mean = 0.01
max = 0.05
scale = auto

[sweep.env.obs_partner_noise_speed]
distribution = log_normal
min = 0.00001
mean = 0.005
max = 0.01
scale = auto

[controlled_exp.env.lambda_value]
values = [0.0]

[controlled_exp.env.fix_rewards]
values = [True]

[controlled_exp.env.fix_lambdas]
values = [True]

