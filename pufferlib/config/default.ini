[base]
package = None
env_name = None
policy_name = Policy
rnn_name = None
max_suggestion_cost = 3600

[vec]
backend = Multiprocessing
num_envs = 2
num_workers = auto
batch_size = auto
zero_copy = True
seed = 42

[env]
[policy]
[rnn]

[train]
name = pufferai
project = ablations

seed = 42
torch_deterministic = True
cpu_offload = False
device = cuda

total_timesteps = 10_000_000
data_dir = experiments
checkpoint_interval = 200

agent = fasttd3

critic_learning_rate = 3e-4
actor_learning_rate = 3e-4
critic_learning_rate_end = 3e-4
actor_learning_rate_end = 3e-4

buffer_size = 51200
num_steps = 1
gamma = 0.99
tau = 0.1
batch_size = 32768

policy_noise = 0.001
std_min = 0.001
std_max = 0.4
learning_starts = 10
policy_frequency = 2
noise_clip = 0.5
num_updates = 2

init_scale = 0.01

num_atoms = 101
v_min = -250.0
v_max = 250.0

critic_hidden_dim = 1024
actor_hidden_dim = 512

use_cdq = True
measure_burnin = 3

compile = True
compile_mode = reduce-overhead

obs_normalization = True
reward_normalization = False

use_grad_norm_clipping = False
max_grad_norm = 0.0

amp = True
amp_dtype = bf16

disable_bootstrap = False
weight_decay = 0.1

sim_type = ""
sim_dimension = 64
critic_seq_len = 8
actor_seq_len = 8

[sweep]
method = Protein
metric = score
goal = maximize
downsample = 10